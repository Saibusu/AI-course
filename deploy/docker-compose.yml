version: "3.8"

services:
  waste-sorter:
    image: ghcr.io/saibusu/ai-course:latest
    container_name: waste-sorter
    restart: unless-stopped
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    volumes:
      - ~/AI-course/models:/app/models:ro
      - ~/AI-course/logs:/app/logs
    devices:
      - /dev/video0
    network_mode: host
    command: python live_detect.py
    healthcheck:
      test: ["CMD", "python", "-c", "from src.config import CLASS_NAMES; assert len(CLASS_NAMES)==5"]
      interval: 30s
      timeout: 10s
      retries: 3
