name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Stage 1: Lint ─────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install ruff
      - run: ruff check src/ tests/ live_detect.py

  # ── Stage 2: Test + Coverage ──────────────────────────────────────────────
  test:
    name: Test (pytest ≥90% coverage)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          pip install pytest pytest-cov numpy pyyaml
      - name: Run tests
        run: |
          pytest tests/ -v \
            --cov=src \
            --cov-report=term-missing \
            --cov-fail-under=90 \
            --ignore=tests/integration

  # ── Stage 3: Security Scan ────────────────────────────────────────────────
  security-scan:
    name: Security (bandit + pip-audit)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install security tools
        run: pip install bandit pip-audit
      - name: Run bandit
        run: bandit -r src/ -ll
      - name: Run pip-audit
        run: pip-audit --requirement requirements.txt --ignore-vuln PYSEC-2022-42969 || true

  # ── Stage 4: Build Docker image (arm64) ──────────────────────────────────
  build:
    name: Build Docker (arm64 → GHCR)
    runs-on: ubuntu-latest
    needs: [test, security-scan]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Set lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Stage 5: Integration Test (self-hosted Jetson runner) ────────────────
  integration-test:
    name: Integration Test (Jetson)
    runs-on: [self-hosted, Linux, ARM64]
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Set lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV
      - name: Pull latest image
        run: |
          docker pull ${{ env.IMAGE }}:latest
      - name: Run smoke test
        run: |
          docker run --rm \
            --runtime nvidia \
            -v ~/AI-course/models:/app/models:ro \
            ${{ env.IMAGE }}:latest \
            python -c "
          import sys
          sys.path.insert(0, '/app')
          from src.config import CLASS_NAMES, GPIO_PINS, CONF_THRESH
          assert len(CLASS_NAMES) == 5, f'Expected 5 classes, got {len(CLASS_NAMES)}'
          assert len(GPIO_PINS) == 5, f'Expected 5 GPIO pins, got {len(GPIO_PINS)}'
          assert CONF_THRESH == 0.55, f'Expected CONF_THRESH=0.55, got {CONF_THRESH}'
          print('✅ Smoke test PASS: 5-class config verified')
          "
      - name: Run unit tests on Jetson
        run: |
          docker run --rm \
            --runtime nvidia \
            ${{ env.IMAGE }}:latest \
            pytest tests/ -v --tb=short
